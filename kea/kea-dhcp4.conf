{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "*" ]
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "kea-leases4.csv"
    },
    "hosts-databases": [
      {
        "type": "postgresql",
        "name": "kea",
        "user": "kea",
        "password": "kea",
        "host": "127.0.0.1",
        "port": 5432
      }
    ],
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "hooks-libraries": [
      {
        "library": "/usr/lib64/kea/hooks/libdhcp_pgsql.so"
      },
      {
        "library": "/usr/lib64/kea/hooks/libdhcp_host_cmds.so"
      },
      {
        "library": "/usr/lib64/kea/hooks/libdhcp_lease_cmds.so"
      }
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.122.0/24",
        "pools": [
          {
            "pool": "192.168.122.100 - 192.168.122.200"
          }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "192.168.122.1"
          },
          {
            "name": "domain-name-servers",
            "data": "192.168.122.1"
          }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          {
            "output": "stdout"
          }
        ],
        "severity": "INFO"
      }
    ]
  }
}
