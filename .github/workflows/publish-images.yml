name: Build and publish test images

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Find container images
        id: images
        shell: bash
        run: |
          files=$(find . -maxdepth 1 -type f -name 'Containerfile.*' -printf '%f\n' | sort)
          entries=$(printf '%s\n' "$files" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({containerfile: ., name: split(".")[-1]})')
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: ${{ fromJSON(needs.discover.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.containerfile }}
          load: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Run ${{ matrix.name }} smoke test
        if: ${{ hashFiles(format('test.{0}.sh', matrix.name)) != '' }}
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.name }}:sha-${{ github.sha }}
        run: |
          docker run --detach --rm --name "smoke-${{ matrix.name }}" \
            --publish 8000:8000/tcp --publish 67:67/udp \
            --cap-add NET_RAW --cap-add NET_BIND_SERVICE "$IMAGE"
          trap 'docker stop "smoke-${{ matrix.name }}" >/dev/null 2>&1 || true' EXIT
          KEA_CONTROL_AGENT_URL=http://127.0.0.1:8000/ "test.${{ matrix.name }}.sh"
      - name: Push image tags
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || docker push "$tag"
          done <<< "$IMAGE_TAGS"
